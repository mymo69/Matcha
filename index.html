<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>🍵 Matcha Ritual — Sakura Edition เกมชงมัทฉะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Matcha Ritual — Sakura Edition
   สารบัญ: 1 พื้นฐาน · 2 โครงแอป · 3 ปุ่ม · 4 หน้าเลือกคนชง · 5 หน้าชง
           6 หน้าผลลัพธ์ · 7 แอนิเมชัน · 8 ปรับตามขนาดจอ
   ========================================================================== */

/* ===== 1) พื้นฐาน ===== */
:root{
  --plum:#4B1D45; --plum2:#7A4A72; --hot:#D6246E; --blush:#FDE4EE; --blush2:#FFF5F8; --lav:#E4DCFF; --rose:#F7C3D8;
  --green-d:#4A6B36;
  --rim:#FBF8F1; --rimline:rgba(201,168,122,.5);               /* สีถ้วย (ตั้งจาก JS) */

  /* ตัวอักษรยืดตามความกว้างจอ แต่ไม่เล็กกว่า 12.5px */
  --fs-xs:clamp(12.5px,3.4vw,14px);
  --fs-sm:clamp(13.5px,3.8vw,15.5px);
  --fs-md:clamp(15px,4.3vw,17px);
  --fs-lg:clamp(17px,5vw,20px);
  --fs-xl:clamp(21px,6.4vw,28px);
  --fs-xxl:clamp(26px,8vw,38px);
  --gap:clamp(8px,2.4vw,14px);
  --pad:clamp(12px,3.8vw,22px);
  --maxw:720px;
  --top-h:56px;
  --r:26px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,.app{background:linear-gradient(180deg,var(--blush2) 0%,var(--blush) 55%,var(--lav) 100%)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{color:var(--plum);-webkit-text-size-adjust:100%;touch-action:manipulation;
  font-family:"Prompt","Noto Sans Thai","Sarabun","Noto Sans","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-md);line-height:1.55;font-weight:600;-webkit-font-smoothing:antialiased;color-scheme:light}
/* ตัดคำไทยตามพจนานุกรมของเบราว์เซอร์ (ไม่หักกลางคำ) */
h1,h2,h3,p,span,small,b,button{word-break:normal;overflow-wrap:break-word;line-break:auto}
p{text-wrap:pretty}
h2{text-wrap:balance}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
img{display:block;-webkit-user-drag:none;user-select:none}
.nw{white-space:nowrap}
[hidden]{display:none!important}

/* ===== 2) โครงแอป: เต็มจอพอดี ไม่เลื่อน ===== */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background-attachment:fixed;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.topbar{flex:none;background:#fff;color:var(--plum);padding-top:env(safe-area-inset-top);box-shadow:0 2px 14px rgba(214,36,110,.12)}
.topbar-in{height:var(--top-h);max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{margin:0;display:flex;align-items:center;gap:8px;min-width:0}
.brand-icon{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;background:var(--blush);border:1.5px solid var(--rose)}
.brand b{font-size:var(--fs-xl);font-weight:800;line-height:1.1;white-space:nowrap}
.tt{display:none;font-size:var(--fs-xs);font-weight:700;padding:1px 10px;border-radius:99px;background:var(--blush);color:var(--hot);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.who{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:var(--blush);border:1.5px solid var(--rose);font-weight:700;font-size:var(--fs-sm)}
.who img{width:30px;height:30px;object-fit:contain;border-radius:50%;border:2px solid #fff;background:#fff}
.icon-btn{width:42px;height:42px;border-radius:50%;font-size:20px;display:grid;place-items:center;background:var(--blush);border:1.5px solid var(--rose)}
.icon-btn[aria-pressed=true]{background:#fff;border-color:var(--hot)}

.steps-in{max-width:var(--maxw);margin:0 auto;padding:6px var(--pad);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.step{min-height:38px;border-radius:99px;font-size:var(--fs-sm);font-weight:700;color:var(--plum2);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;border:1.5px solid transparent}
.step[aria-current=step]{background:#fff;color:var(--hot);border-color:#F7B3CF;box-shadow:0 4px 12px rgba(214,36,110,.14)}
.step:disabled{opacity:.45;cursor:default}
.steps{flex:none}

.main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);
  padding:var(--gap) var(--pad) calc(var(--gap) + env(safe-area-inset-bottom));min-height:0}
.actions{flex:none;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}

/* ===== 3) ปุ่ม ===== */
.btn{min-height:52px;padding:0 22px;border-radius:99px;font-size:var(--fs-lg);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  white-space:nowrap;box-shadow:0 8px 20px rgba(214,36,110,.16);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none!important}
.btn.green{background:linear-gradient(135deg,#8FD487,#4E9E58);color:#fff;box-shadow:0 8px 20px rgba(78,158,88,.35)}
.btn.pink{background:linear-gradient(135deg,#FF7EB3,#D6246E);color:#fff;box-shadow:0 8px 20px rgba(214,36,110,.35)}
.btn.ghost{background:#fff;border:2px solid var(--rose);color:var(--plum);font-size:var(--fs-md);min-height:46px;padding:0 16px;box-shadow:none}
.link{align-self:center;font-size:var(--fs-sm);font-weight:700;background:#fff;border:2px solid var(--rose);border-radius:99px;padding:6px 16px;min-height:40px;display:inline-flex;align-items:center;gap:6px}

/* ===== 4) หน้าเลือกคนชง ===== */
.select{overflow:hidden}
.bg-bowl{position:absolute;left:50%;top:48%;width:min(70vw,300px);transform:translate(-50%,-50%);opacity:.06;pointer-events:none}
.sel-banner{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:2px solid var(--rose);border-radius:24px;padding:7px 14px;box-shadow:0 4px 14px rgba(214,36,110,.1)}
.sel-banner h2{margin:0;font-size:var(--fs-xl);font-weight:800;line-height:1.2}
.sel-banner .count{font-size:var(--fs-sm);font-weight:800;color:var(--hot);background:var(--blush);padding:3px 14px;border-radius:99px;white-space:nowrap}

.cards{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
  gap:calc(var(--gap) + 6px) var(--gap);padding-top:12px}
.card{position:relative;min-height:0;display:flex;flex-direction:column;text-align:center;background:var(--bg,#fff);border:3.5px solid #fff;border-radius:var(--r);
  box-shadow:0 6px 16px rgba(75,29,69,.12);transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s,border-color .25s}
.card[aria-checked=true]{border:4px solid var(--hot);transform:scale(1.02);box-shadow:0 12px 26px rgba(214,36,110,.36)}
.card .pic{position:relative;flex:1;min-height:0}
.card .pic img{position:absolute;left:50%;bottom:0;width:122%;height:118%;max-width:none;transform:translateX(-50%);
  object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 6px 6px rgba(75,29,69,.22))}
.card .info{flex:none;padding:0 4px 8px;display:flex;flex-direction:column;align-items:center}
.card .nm{font-size:clamp(13px,3.7vw,15px);font-weight:800;line-height:1.25;white-space:nowrap}
.card .tg{font-size:12px;font-weight:700;line-height:1.2;color:var(--plum2)}
.card .tick{position:absolute;top:-8px;right:-4px;z-index:4;width:26px;height:26px;border-radius:50%;background:var(--hot);color:#fff;border:2px solid #fff;
  display:none;place-items:center;font-size:15px;font-weight:700}
.card[aria-checked=true] .tick{display:grid}
.card .new{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:3;background:var(--hot);color:#fff;font-weight:800;font-size:11px;line-height:1.6;
  padding:0 9px;border-radius:99px;box-shadow:0 3px 8px rgba(214,36,110,.4);letter-spacing:.02em}
.c-maneki{--bg:linear-gradient(155deg,#FFE5BF 0%,#FF9C5A 100%)}
.c-shiba{--bg:linear-gradient(155deg,#FFF3C4 0%,#F6B01E 100%)}
.c-kappa{--bg:linear-gradient(155deg,#CBF7D9 0%,#52DB82 100%)}
.c-yuki{--bg:linear-gradient(155deg,#E8DCFF 0%,#B197FC 100%)}
.c-chano{--bg:linear-gradient(155deg,#FFDDEC 0%,#F6A5C8 100%)}
.c-nene{--bg:linear-gradient(155deg,#FFE9C2 0%,#FFA94D 100%)}

.gear{flex:none;position:relative;display:flex;flex-direction:column;gap:5px;background:#fff;border:2px solid var(--rose);border-radius:22px;padding:6px 10px;box-shadow:0 4px 14px rgba(214,36,110,.1)}
.gear-row{display:flex;align-items:center;gap:8px;min-width:0}
.gear-t{flex:none;width:62px;font-size:var(--fs-sm);font-weight:800;white-space:nowrap}
.opts{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt{min-height:36px;border-radius:99px;border:2px solid var(--rose);background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;
  font-size:var(--fs-xs);font-weight:800;white-space:nowrap;transition:transform .15s,background .2s}
.opt:active{transform:scale(.96)}
.opt[aria-checked=true]{border-color:var(--hot);background:#FFF0F6;color:var(--hot);box-shadow:0 3px 8px rgba(214,36,110,.24)}
.opt svg{width:24px;height:24px;flex:none}
.sw{width:22px;height:22px;border-radius:50%;flex:none;background:#8FB07E;border:5px solid var(--c);box-shadow:0 0 0 1.5px rgba(75,29,69,.18)}

.tipbar{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;background:#fff;border:2px solid var(--rose);border-radius:24px;
  padding:6px 12px;color:var(--hot);font-weight:800;font-size:var(--fs-sm);box-shadow:0 4px 14px rgba(214,36,110,.1)}
.tipbar.picked{background:#FFF0F6}
.tipbar span{white-space:nowrap}

/* ===== 5) หน้าชงมัทฉะ ===== */
.stats{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:#fff;border:2px solid var(--rose);border-radius:20px;padding:7px 8px 8px;box-shadow:0 4px 12px rgba(214,36,110,.1);min-width:0}
.stat .t{display:flex;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:700;line-height:1.2;white-space:nowrap}
.stat .v{display:flex;flex-direction:column;align-items:flex-start;margin-top:1px;white-space:nowrap}
.stat .v b{font-size:var(--fs-lg);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12.5px;line-height:1.25;color:var(--plum2);font-weight:600}
.bar{height:7px;border-radius:9px;background:rgba(214,36,110,.12);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--green-d);transition:width .25s linear}
.hint{flex:none;align-self:center;max-width:100%;display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;background:#fff;border:2px solid var(--rose);
  font-size:var(--fs-sm);font-weight:700;text-align:center;line-height:1.35;box-shadow:0 4px 12px rgba(214,36,110,.1)}
.hint.gold{background:#FFF0F6;color:var(--hot);border-color:var(--hot)}

.stage-area{flex:1;min-height:0;position:relative}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--bowl,min(84vw,44dvh));height:var(--bowl,min(84vw,44dvh))}
.bowl{position:absolute;inset:0;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  background:radial-gradient(ellipse at 30% 30%,rgba(255,255,255,.9) 0,rgba(255,255,255,.24) 20%,transparent 54%),
    radial-gradient(ellipse at 50% 56%,#2E4F24 0,#4E6F3E 18%,#6F8F5E 42%,#8FB07E 74%,#A9C9A4 100%);
  box-shadow:0 14px 36px rgba(75,29,69,.2),0 6px 16px rgba(75,29,69,.1),inset 0 0 0 10px var(--rim),inset 0 0 0 12px var(--rimline),inset 0 12px 24px rgba(18,20,18,.1)}
.bowl.live{cursor:none}
.bowl .foam{position:absolute;inset:9px;border-radius:50%;pointer-events:none}
.bowl .gloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:inset 0 7px 22px rgba(18,20,18,.18),inset 0 -6px 18px rgba(255,255,255,.46)}
.bowl canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}
/* มือถือไม้ชง: ปลายไม้ (ล่างกลาง) อยู่ที่จุดที่นิ้วแตะ */
.whisk{position:absolute;left:0;top:0;width:calc(var(--bowl,260px)*.36);min-width:78px;aspect-ratio:120/210;opacity:.92;pointer-events:none;
  transform-origin:50% 97.6%;will-change:transform;contain:layout style;transition:opacity .25s}
.whisk svg{display:block;width:100%;height:100%;overflow:visible}
.mascot{position:absolute;left:0;top:0;width:26%;pointer-events:none;z-index:3;animation:floaty 2.2s ease-in-out infinite}
.mascot.bob{animation:bob .18s ease}
.mascot .face{aspect-ratio:1;border-radius:50%;background:linear-gradient(155deg,#FFE5F0,#F9B6D2);border:3px solid #fff;box-shadow:0 8px 18px rgba(214,36,110,.32);overflow:hidden;position:relative}
.mascot .face img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain}
.mascot .mood{position:absolute;right:-6px;top:-6px;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--rose);display:grid;place-items:center;font-size:15px}
.trail{position:absolute;right:0;bottom:0;width:30%;height:22%;border-radius:12px;background:rgba(255,255,255,.94);border:2px solid var(--rose);box-shadow:0 2px 12px rgba(18,20,18,.08);
  overflow:hidden;z-index:3;opacity:0;transition:opacity .3s;pointer-events:none}
.trail.on{opacity:1}
.trail svg{width:100%;height:100%}
.trail span{position:absolute;right:6px;bottom:1px;font-size:12.5px;font-weight:700;color:var(--plum2)}

/* ===== 6) หน้าผลลัพธ์ ===== */
.result{overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:9px;border-radius:50% 0 50% 0;animation:fall 1.8s ease-out forwards}
.r-head{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.r-head>div{min-width:0}
.r-head small.k{display:block;font-size:var(--fs-xs);font-weight:700;color:var(--hot);letter-spacing:.06em}
.r-head h2{margin:2px 0 0;font-size:var(--fs-xl);line-height:1.2;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.r-head h2 small{font-size:var(--fs-sm);font-weight:700;color:var(--plum2)}
.r-head p{margin:2px 0 0;font-size:var(--fs-sm);font-weight:600;color:var(--plum2)}
.badge{flex:none;width:clamp(52px,15vw,68px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;
  font-size:var(--fs-xxl);font-weight:700;box-shadow:0 6px 18px rgba(18,20,18,.2)}
.r-visual{flex:1 1 0;min-height:56px;position:relative;display:flex;align-items:center;justify-content:center;gap:var(--gap)}
.r-mascot{position:relative;height:100%;max-height:150px;aspect-ratio:1;margin:0}
.r-mascot img{width:100%;height:100%;object-fit:contain;padding:4%;border-radius:50%;border:3px solid #fff;background:linear-gradient(155deg,#FFE5F0,#F9B6D2);
  box-shadow:0 8px 18px rgba(214,36,110,.25);animation:popIn .5s cubic-bezier(.16,1,.3,1)}
.r-mascot .react{position:absolute;right:-4px;top:-2px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--rose);display:grid;place-items:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.r-bowl{flex:none;position:relative;overflow:hidden;height:100%;max-height:110px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,#D6E8C8 0,#A9C9A4 46%,#7FA77A 86%);
  box-shadow:inset 0 0 0 6px var(--rim),inset 0 8px 14px rgba(18,20,18,.18),0 8px 20px rgba(18,20,18,.12)}
.r-bowl i{position:absolute;border-radius:50%;background:rgba(255,255,255,.92)}
.say{flex:none;position:relative;background:#fff;border:2px solid var(--rose);border-radius:22px;padding:9px 13px;box-shadow:0 4px 12px rgba(214,36,110,.1)}
.say .who2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-sm);font-weight:700}
.say .mood2{margin-left:auto;font-size:var(--fs-xs);font-weight:800;color:var(--hot);background:var(--blush);padding:2px 10px;border-radius:99px;white-space:nowrap}
.say p{margin:4px 0 0;font-size:var(--fs-md);line-height:1.6}
.metrics{flex:none;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{min-width:0;background:#fff;border:2px solid var(--rose);border-radius:22px;padding:7px 11px 8px;box-shadow:0 4px 12px rgba(214,36,110,.1)}
.metric .t{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:6px;font-size:var(--fs-xs);font-weight:700;line-height:1.3}
.metric .t span,.metric .t em{white-space:nowrap}
.metric .t em{font-style:normal;font-weight:600;color:var(--plum2)}
.metric .n{display:flex;align-items:baseline;gap:4px;line-height:1.25}
.metric .n b{font-size:var(--fs-xl);font-weight:700;font-variant-numeric:tabular-nums}
.metric .n small{font-size:var(--fs-xs);color:var(--plum2);font-weight:600}
.metric .bar{margin-top:3px}

/* ===== 7) แอนิเมชัน ===== */
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}16%{opacity:1}100%{transform:translateY(60dvh) rotate(420deg) translateX(22px);opacity:0}}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes popIn{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.screen:not([hidden]){animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 8) ปรับตามขนาดจอ ===== */
@media (min-width:560px){.tt{display:inline-block}}
@media (max-width:379px){.who span{display:none}.who{padding:3px}.brand b{font-size:var(--fs-lg)}}
@media (max-height:640px){
  :root{--top-h:50px;--gap:7px}
  .steps{display:none}
  .btn{min-height:48px}
  .stat{padding:5px 7px 6px}
  .bar{margin-top:3px}
  .say p{line-height:1.5}
  .sel-banner{padding:6px 12px}
}
@media (max-height:600px){.r-visual,.tipbar{display:none}}
@media (max-height:560px){
  .metric{padding:5px 10px 6px}
  .metric .n b{font-size:var(--fs-lg)}
  .say{padding:6px 11px}
}
/* แนวนอนบนมือถือ: แบ่งซ้าย-ขวา */
@media (orientation:landscape) and (max-height:520px){
  :root{--top-h:46px;--maxw:1000px;--gap:6px}
  .steps,.tipbar,.bg-bowl{display:none}
  .brand b{font-size:var(--fs-lg)}
  .btn{min-height:40px;font-size:var(--fs-md)}
  .btn.ghost{min-height:36px}
  .sel-banner{padding:3px 12px}
  .sel-banner h2{font-size:var(--fs-lg)}

<script>
/* ==========================================================================
   ENGINE — ตรรกะคำนวณคะแนน (ไม่ยุ่งกับ DOM จึงทดสอบแยกได้)
   พิกัดทั้งหมดถูก "ทำให้เป็นสัดส่วนของเส้นผ่านศูนย์กลางถ้วย (D)"
   u,v ∈ [-0.5, 0.5] โดย (0,0) คือกลางถ้วย → คะแนนเท่ากันทุกขนาดหน้าจอ
   ========================================================================== */

const CFG = Object.freeze({
  maxSeconds: 30,            // ครบเวลานี้ระบบเสิร์ฟให้อัตโนมัติ
  goldFrom: 15,              // ช่วงทอง (วินาที)
  goldTo: 20,
  minServeSeconds: 2,        // เงื่อนไขกดเสิร์ฟได้
  minServeStrokes: 3,
  startMoveDist: 0.02,       // ขยับสะสมเกินนี้ถึงเริ่มจับเวลา
  jitter: 0.0015,            // ขยับน้อยกว่านี้ถือเป็นสัญญาณรบกวน

  // ความเนียน = ความสม่ำเสมอของความเร็วในแต่ละช่วง 200 ms
  binMs: 200,
  warmupMs: 600,
  cvMax: 0.85,               // CV ≥ ค่านี้ = 0 คะแนน
  minMeanSpeed: 0.5,         // ช้ากว่านี้ (D/วินาที) ถือว่าไม่ได้ตี

  // ท่า M = ซิกแซกซ้าย-ขวา
  strokeMinAmp: 0.09,        // ระยะวิ่งขั้นต่ำต่อ 1 สโตรก
  targetRate: 4.0,           // สโตรก/วินาที ที่ได้เต็ม
  targetAmp: 0.38,           // ความกว้างสโตรกเฉลี่ยที่ได้เต็ม

  // ความทั่วถึง
  grid: 12,
  whiskRadius: 0.075,

  // ฟอง
  foamTau: 12,
  foamRamp: 15,              // ฟองเต็มที่เมื่อชงครบ ~15 วิ
  collapseFrom: 20,
  collapseRate: 0.035,
  collapseFloor: 0.55,

  mGateFull: 70,             // ท่า M ถึงค่านี้ = คะแนนรวมไม่ถูกลด (ต่ำกว่านั้นลดสูงสุด 50%)
  coverageFull: 70,          // ทั่วถึง 70% ถือว่าเต็ม (ขอบถ้วยลากยาก)
  regularityFrom: 0.15,      // CV ของจังหวะสโตรก ≤ ค่านี้ = สม่ำเสมอเต็ม
  regularitySpan: 0.60,
  weights: Object.freeze({ time: 0.15, smooth: 0.25, m: 0.30, foam: 0.30 }),
  grades: Object.freeze({ S: 90, A: 80, B: 65 }),
});

const clamp = (x, lo = 0, hi = 1) => (Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : lo);

class WhiskEngine {
  constructor(perks = {}) {
    this.perks = perks;
    this.cells = CELLS;          // ตำแหน่งช่องที่อยู่ในถ้วย (คำนวณครั้งเดียว)
    this.reset();
  }

  reset() {
    this.started = false;
    this.t0 = 0;
    this.last = null;            // {u,v,t} ของจุดล่าสุดที่นิ้วแตะอยู่
    this.moved = 0;              // ระยะสะสมก่อนเริ่มจับเวลา
    this.pathLen = 0;
    this.lenH = 0;               // ความยาวเส้นทางที่เคลื่อนแนวนอนเป็นหลัก
    this.bins = [];
    this.strokes = 0;
    this.ampSum = 0;
    this.strokeTimes = [];
    this.dir = 0;
    this.hi = 0;
    this.lo = 0;
    this.turnPos = 0;
    this.foamWork = 0;
    this.covered = new Uint8Array(this.cells.list.length);
    this.coveredCount = 0;
    this.recent = [];
    this.orbitSum = 0;
    this.orbitN = 0;
    this.orbitT = 0;
    this.recentT = 0;
    this.upT = null;             // เวลาที่ยกนิ้วล่าสุด (null = นิ้วแตะอยู่)
    this.upMs = 0;               // เวลายกนิ้วสะสม (ไม่นับเป็นเวลาตี)
    this.skip = new Set();       // ช่วง 200ms ที่นิ้วไม่ได้แตะ → ไม่เอาไปคิดความเนียน
    this.breaks = new Set();     // ลำดับสโตรกที่ช่วงห่างข้ามการยกนิ้ว → ไม่เอาไปคิดความสม่ำเสมอ
  }

  pointerDown(u, v, t) {
    if (this.started && this.upT != null) {          // แตะกลับมาหลังยกนิ้ว → บันทึกเป็นช่วงพัก
      this.upMs += Math.max(0, t - this.upT);
      const a = Math.max(0, Math.floor((this.upT - this.t0) / CFG.binMs));
      for (let i = a, b = Math.floor((t - this.t0) / CFG.binMs); i <= b; i++) this.skip.add(i);
    }
    if (this.upT != null) this.breaks.add(this.strokeTimes.length);
    this.upT = null;
    this.last = { u, v, t };
  }

  pointerUp(t) {
    if (this.last && this.started) this.upT = Number.isFinite(t) ? t : this.last.t;
    this.last = null;
  }

  /** เลื่อนนาฬิกาทั้งชุด (ใช้ตอนสลับแอปแล้วกลับมา เวลาที่หายไปจะไม่ถูกนับ) */
  shift(dt) {
    this.t0 += dt;
    if (this.upT != null) this.upT += dt;
  }

  /** คืนค่า {stroke:boolean, started:boolean} เพื่อให้ UI ใส่เสียง/สั่น */
  pointerMove(u, v, t) {
    const out = { stroke: false, started: false };
    const p = this.last;
    if (!p) return out;
    const du = u - p.u;
    const dv = v - p.v;
    const dist = Math.hypot(du, dv);
    if (dist < CFG.jitter) return out;       // ไม่อัปเดต last → ระยะค่อยๆ สะสมจนเกินเกณฑ์

    this.last = { u, v, t };

    if (!this.started) {
      this.moved += dist;
      if (this.moved < CFG.startMoveDist) return out;
      this.started = true;
      this.t0 = t;
      this.hi = this.lo = u;
      out.started = true;
    }

    // ---- ความยาวเส้นทาง + แนวนอน ----
    this.pathLen += dist;
    if (Math.abs(du) >= 0.55 * Math.abs(dv)) this.lenH += dist;
    this.foamWork += 0.1 * dist;

    // ---- ช่วงความเร็ว (bins) ----
    const idx = Math.max(0, Math.floor((t - this.t0) / CFG.binMs));
    while (this.bins.length <= idx) this.bins.push(0);
    this.bins[idx] += dist;

    // ---- ตรวจสโตรกซิกแซก (peak detection แบบมี hysteresis) ----
    out.stroke = this._detectStroke(u, t);

    // ---- ความทั่วถึง (เติมช่องตามเส้นที่ลาก) ----
    this._paint(p.u, p.v, u, v, dist);

    // ---- จุดล่าสุดไว้คำนวณการ "วน" ----
    if (t - this.recentT >= 16) {          // ลดความถี่เหลือ ~60Hz ให้ผลเท่ากันทุกจอ
      this.recentT = t;
      this.recent.push(u, v);
    }
    if (this.recent.length > 120) this.recent.splice(0, this.recent.length - 120);
    if (t - this.orbitT >= 100) {          // เก็บค่าเฉลี่ยการวนตลอดรอบ (กันค่ากระโดด)
      this.orbitT = t;
      this.orbitSum += this._orbit();
      this.orbitN += 1;
    }
    return out;
  }

  _detectStroke(u, t) {
    const h = CFG.strokeMinAmp * (this.perks.strokeAmpMul || 1);
    let amp = 0;
    if (this.dir === 0) {
      this.hi = Math.max(this.hi, u);
      this.lo = Math.min(this.lo, u);
      if (u - this.lo >= h) { this.dir = 1; this.hi = u; this.turnPos = this.lo; }
      else if (this.hi - u >= h) { this.dir = -1; this.lo = u; this.turnPos = this.hi; }
    } else if (this.dir === 1) {
      if (u > this.hi) this.hi = u;
      else if (this.hi - u >= h) {
        amp = this.hi - this.turnPos;
        this.dir = -1; this.lo = u; this.turnPos = this.hi;
      }
    } else {
      if (u < this.lo) this.lo = u;
      else if (u - this.lo >= h) {
        amp = this.turnPos - this.lo;
        this.dir = 1; this.hi = u; this.turnPos = this.lo;
      }
    }
    if (amp <= 0) return false;
    const a = Math.min(amp, 0.9);
    this.strokes += 1;
    this.ampSum += a;
    this.foamWork += a;
    this.strokeTimes.push(t);
    return true;
  }

  _paint(u0, v0, u1, v1, dist) {
    const { grid } = CFG;
    const r = CFG.whiskRadius;
    const steps = Math.max(1, Math.ceil(dist / 0.02));
    for (let s = 1; s <= steps; s++) {
      const f = s / steps;
      const pu = u0 + (u1 - u0) * f;
      const pv = v0 + (v1 - v0) * f;
      const i0 = Math.max(0, Math.floor((pu - r + 0.5) * grid));
      const i1 = Math.min(grid - 1, Math.floor((pu + r + 0.5) * grid));
      const j0 = Math.max(0, Math.floor((pv - r + 0.5) * grid));
      const j1 = Math.min(grid - 1, Math.floor((pv + r + 0.5) * grid));
      for (let j = j0; j <= j1; j++) {
        for (let i = i0; i <= i1; i++) {
          const k = this.cells.index[j * grid + i];
          if (k < 0 || this.covered[k]) continue;
          const c = this.cells.list[k];
          const dx = c[0] - pu, dy = c[1] - pv;
          if (dx * dx + dy * dy <= r * r) { this.covered[k] = 1; this.coveredCount++; }
        }
      }
    }
  }

  /** ระดับ "วนเป็นวงกลม" 0..1 วัดจากพื้นที่ที่เส้นกวาดรอบจุดกลาง (ซิกแซกกลับไปกลับมาหักล้างกัน ≈ 0, วงกลม ≈ 1) */
  _orbit() {
    const pts = this.recent;
    const n = pts.length / 2;
    if (n < 16) return 0;
    let cx = 0, cy = 0;
    for (let i = 0; i < n; i++) { cx += pts[2 * i]; cy += pts[2 * i + 1]; }
    cx /= n; cy /= n;
    let net = 0, den = 0;
    for (let i = 1; i < n; i++) {
      const x0 = pts[2 * i - 2] - cx, y0 = pts[2 * i - 1] - cy;
      const dx = pts[2 * i] - pts[2 * i - 2], dy = pts[2 * i + 1] - pts[2 * i - 1];
      net += x0 * dy - y0 * dx;
      den += Math.hypot(x0, y0) * Math.hypot(dx, dy);
    }
    return den > 1e-9 ? Math.min(1, Math.abs(net) / den) : 0;
  }

  /** ความสม่ำเสมอของจังหวะสโตรก 0..1 (ดูจาก CV ของช่วงห่างระหว่างสโตรก) */
  _regularity() {
    const ts = this.strokeTimes;
    if (ts.length < 6) return 0.5;
    const gaps = [];
    for (let i = Math.max(1, ts.length - 40); i < ts.length; i++) if (!this.breaks.has(i)) gaps.push(ts[i] - ts[i - 1]);
    if (gaps.length < 5) return 0.5;
    const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    if (mean <= 0) return 0;
    const sd = Math.sqrt(gaps.reduce((a, b) => a + (b - mean) * (b - mean), 0) / gaps.length);
    return 1 - clamp((sd / mean - CFG.regularityFrom) / CFG.regularitySpan);
  }

  _smoothness(t) {
    let end = Math.floor((t - this.t0) / CFG.binMs);              // bin ที่จบแล้ว
    if (this.upT != null) end = Math.min(end, Math.floor((this.upT - this.t0) / CFG.binMs));
    const from = Math.ceil(CFG.warmupMs / CFG.binMs);
    const sp = [];
    for (let i = from; i < end; i++) if (!this.skip.has(i)) sp.push(((this.bins[i] || 0) / CFG.binMs) * 1000);
    if (sp.length < 3) return 0;
    const mean = sp.reduce((a, b) => a + b, 0) / sp.length;
    if (mean < 1e-4) return 0;
    const sd = Math.sqrt(sp.reduce((a, b) => a + (b - mean) * (b - mean), 0) / sp.length);
    const consistency = clamp(1 - sd / mean / CFG.cvMax);
    const pace = clamp(mean / CFG.minMeanSpeed);
    return clamp(consistency * pace * (this.perks.smoothMul || 1)) * 100;
  }

  /** ค่าสถิติสด ณ เวลา t (ms, ตามนาฬิกาเดียวกับ pointerMove) */
  metrics(t) {
    const elapsed = this.started ? Math.max(0, (t - this.t0) / 1000) : 0;
    const P = this.perks;
    const upNow = this.upT != null ? Math.max(0, t - this.upT) : 0;
    const active = Math.max(0, elapsed - (this.upMs + upNow) / 1000);      // เวลาที่นิ้วแตะจริง
    const rate = this.strokes / Math.max(active, 1.5);
    const rateScore = clamp(rate / (CFG.targetRate * (P.rateTargetMul || 1)));
    const avgAmp = this.strokes ? this.ampSum / this.strokes : 0;
    const ampScore = clamp(avgAmp / CFG.targetAmp);
    const dom = this.pathLen > 0 ? this.lenH / this.pathLen : 0;
    const orbit = this.orbitN ? this.orbitSum / this.orbitN : 0;
    const nonCircular = 1 - clamp((orbit - 0.35) / 0.4);
    const regularity = this._regularity();
    // ท่า M = จังหวะ × ความกว้าง × แนวนอน  แล้ว "คูณ" ด้วยตัวลงโทษ (ตีแคบ / จังหวะมั่ว / คนวน)
    const base = 0.4 * rateScore + 0.3 * ampScore + 0.3 * dom;
    const ampGate = clamp(avgAmp / (0.7 * CFG.targetAmp));
    const mShape = 100 * clamp(base * ampGate * (0.3 + 0.7 * regularity) * (0.2 + 0.8 * nonCircular) * (0.3 + 0.7 * rateScore));   // ตีช้ากว่าเป้า → ท่า M ลดตามสัดส่วน

    const total = this.cells.list.length;
    const coverage = total ? (this.coveredCount / total) * 100 : 0;

    const tau = CFG.foamTau * (P.foamTauMul || 1);
    const build = 1 - Math.exp(-this.foamWork / tau);
    const ramp = clamp(0.35 + 0.65 * (elapsed / CFG.foamRamp), 0.35, 1);
    const over = Math.max(0, elapsed - CFG.collapseFrom);
    const collapse = Math.max(CFG.collapseFloor, 1 - over * CFG.collapseRate * (P.collapseMul || 1));
    const foam = 100 * clamp(build * ramp * collapse * (P.foamMul || 1));

    return {
      elapsed, active,
      smoothness: this.started ? this._smoothness(t) : 0,
      mShape, coverage, foam,
      strokes: this.strokes,
      rate, avgAmp, dom, orbit, regularity,
      canServe: elapsed >= CFG.minServeSeconds && this.strokes >= CFG.minServeStrokes,
    };
  }

  /** ท่าลากล่าสุด (สำหรับวาดกราฟเล็กๆ) */
  trail(n = 40) {
    const out = [];
    const pts = this.recent;
    for (let i = Math.max(0, pts.length / 2 - n); i < pts.length / 2; i++) out.push([pts[2 * i], pts[2 * i + 1]]);
    return out;
  }
}

/* ช่องตาราง 12×12 เฉพาะที่อยู่ "ในถ้วย" (ไม่นับมุมที่นิ้วลากไปไม่ถึง) */
const CELLS = (() => {
  const g = CFG.grid;
  const list = [];
  const index = new Int16Array(g * g).fill(-1);
  for (let j = 0; j < g; j++) {
    for (let i = 0; i < g; i++) {
      const cx = (i + 0.5) / g - 0.5;
      const cy = (j + 0.5) / g - 0.5;
      if (Math.hypot(cx, cy) <= 0.5 - 0.02) { index[j * g + i] = list.length; list.push([cx, cy]); }
    }
  }
  return { list, index };
})();

/* ---------- ให้คะแนนรวม + เกรด + คำแนะนำ ---------- */
function timeScoreOf(sec) {
  if (sec >= CFG.goldFrom && sec <= CFG.goldTo) return 100;
  if (sec < CFG.goldFrom) return clamp(100 - (CFG.goldFrom - sec) * 10, 0, 100);
  return clamp(100 - (sec - CFG.goldTo) * 6, 0, 100);
}

function scoreRun(m) {
  const timeScore = Math.round(timeScoreOf(m.elapsed));
  const smoothness = Math.round(clamp(m.smoothness, 0, 100));
  const mShape = Math.round(clamp(m.mShape, 0, 100));
  const coverage = Math.round(clamp(m.coverage, 0, 100));
  const coverageScore = clamp(coverage / CFG.coverageFull) * 100;
  const foamScore = Math.round(coverageScore * 0.5 + clamp(m.foam, 0, 100) * 0.5);
  const W = CFG.weights;
  const raw = timeScore * W.time + smoothness * W.smooth + mShape * W.m + foamScore * W.foam;
  const total = Math.round(raw * (0.5 + 0.5 * clamp(mShape / CFG.mGateFull)));   // ไม่ใช่ท่า M → คะแนนรวมถูกลด

  let grade = 'C', gradeEmoji = '🫘', gradeLabel = 'ลองใหม่นะ';
  if (total >= CFG.grades.S) { grade = 'S'; gradeEmoji = '🌟'; gradeLabel = 'เทพมัทฉะ'; }
  else if (total >= CFG.grades.A) { grade = 'A'; gradeEmoji = '🍃'; gradeLabel = 'เซียนชง'; }
  else if (total >= CFG.grades.B) { grade = 'B'; gradeEmoji = '🌱'; gradeLabel = 'มือใหม่หัดชง'; }

  return { timeScore, smoothness, mShape, coverage, foamScore, total, grade, gradeEmoji, gradeLabel,
           feedback: feedbackFor({ grade, elapsed: m.elapsed, smoothness, mShape, coverage: coverageScore, orbit: m.orbit, dom: m.dom }) };
}

/* ข้อความโค้ช: เลือก "จุดอ่อนที่สุด" มาแนะนำ ( | = จุดตัดคำภาษาไทย ) */
function feedbackFor({ grade, elapsed, smoothness, mShape, coverage, orbit, dom }) {
  if (grade === 'S') return 'ฟองเนียนนุ่มละมุน|สมบูรณ์แบบ|พิธีชงชา! มือคุณนิ่ง|เหมือนอาจารย์ชา|เลย';
  if (elapsed < 12) return 'ใจเย็นๆ|นะ รีบเสิร์ฟ|ไปหน่อย มัทฉะ|ต้องใช้เวลา 15 วิ|ให้ฟองขึ้น';
  if (elapsed > 26) return 'ตีเพลินไป|หน่อย ฟองเริ่ม|แตกแล้ว รอบหน้า|15-20 วิ|กำลังดี';
  if (orbit > 0.55 && mShape < 60) return 'วนเป็นวงกลมอยู่นะ|ลองซิกแซกซ้าย-ขวา|เป็นตัว M แทน|การคนวน';
  if (dom < 0.4 && mShape < 60) return 'ลากแนวนอนนะ|ซ้าย → ขวา|เหมือนเขียนตัว M|ไม่ใช่ขึ้น-ลง';
  const weak = [['smooth', smoothness], ['m', mShape], ['cover', coverage]].sort((a, b) => a[1] - b[1])[0];
  if (weak[1] < 70) {
    if (weak[0] === 'smooth') return 'แรงตีไม่สม่ำเสมอ|ลองตีให้จังหวะ|คงที่กว่านี้ ข้อมือ|เบาๆ แต่เร็ว';
    if (weak[0] === 'm') return 'ฟองสวยแล้ว! แต่ลอง|ลากเป็นตัว M|ให้ชัดขึ้นอีกนิด|จะเป๊ะกว่าเดิม';
    return 'ตีกระจาย|ทั่วถ้วยอีกนิดนะ|ผงยังกองอยู่|มุมถ้วย ลากให้ทั่วๆ';
  }
  if (grade === 'A') return 'เกือบเทพแล้ว!|ฝึกจังหวะ|ซิกแซกให้นิ่ง|อีกนิดเดียวก็ได้ S';
  if (grade === 'B') return 'ดีขึ้นเยอะ! ใกล้จะเป็น|มัทฉะร้านดังแล้ว|ฝึกจังหวะ M|อีกหน่อย';
  return 'เริ่มต้นได้ดี! จำไว้ว่า|M ไม่ใช่การคนวน|ต้องซิกแซกซ้ายขวา|เร็วๆ → ← → ←';
}

  function buildWhisk() { D.whisk.innerHTML = handWhiskSvg(WHISKS[S.whiskIdx].c); }

  function perksNow() {
    const o = {};
    [S.char.perks, WHISKS[S.whiskIdx].perks].forEach((p) => { for (const k in p) o[k] = (o[k] || 1) * p[k]; });
    return o;
  }

  /* ---------- ขนาดถ้วยให้พอดีพื้นที่ (ไม่ล้น ไม่ตกขอบ) ---------- */
  function layoutStage() {
    const a = D.stageArea.getBoundingClientRect();
    if (!a.width || !a.height) return;
    const size = Math.max(120, Math.floor(Math.min(a.width, a.height)));
    D.stage.style.setProperty('--bowl', `${size}px`);
    S.bowlRect = D.bowl.getBoundingClientRect();
    const c = D.fx;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(size * dpr); c.height = Math.round(size * dpr);
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    S.fxDirty = true;
    if (!S.playing || S.pointerId == null) { S.whisk.x = S.whisk.tx = size / 2; S.whisk.y = S.whisk.ty = size / 2; }
  }

  /* ---------- เริ่มรอบใหม่ ---------- */
  function startRun() {
    if (!S.char) return;
    S.engine = new WhiskEngine(perksNow());
    S.finished = false;
    S.playing = true;
    S.pointerId = null;
    S.particles = [];
    S.lastMetrics = S.engine.metrics(0);
    D.mascotImg.src = ASSETS[S.char.id].src;
    D.trail.classList.remove('on');
    go('play');
    D.bowl.classList.remove('live');
    D.whisk.style.opacity = 0.92;
    S.fxDirty = true;
    refreshUi(performance.now(), true);
    layoutStage();
    startLoop();
  }

  /* ---------- การลาก ---------- */
  function toNorm(e) {
    const r = S.bowlRect = D.bowl.getBoundingClientRect();
    const R = r.width / 2;
    let x = e.clientX - r.left - R, y = e.clientY - r.top - R;
    const d = Math.hypot(x, y), lim = R - 4;
    if (d > lim) { x = x / d * lim; y = y / d * lim; }       // ล็อกอยู่ในขอบถ้วย
    return { px: x + R, py: y + R, u: x / r.width, v: y / r.width };
  }

  function onDown(e) {
    if (!S.playing || S.finished || S.pointerId != null) return;
    e.preventDefault();
    S.pointerId = e.pointerId;
    try { D.bowl.setPointerCapture(e.pointerId); } catch (_) { /* บางเบราว์เซอร์ไม่รองรับ */ }
    const p = toNorm(e);
    S.engine.pointerDown(p.u, p.v, tsOf(e));
    S.whisk.tx = p.px; S.whisk.ty = p.py;
    D.bowl.classList.add('live');
    D.whisk.style.opacity = 1;
    if (S.sound) ensureAudio();
  }

  function onMove(e) {
    if (e.pointerId !== S.pointerId || !S.playing || S.finished) return;
    e.preventDefault();
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const evs = list && list.length ? list : [e];
    for (const ev of evs) {
      const p = toNorm(ev);
      const t = tsOf(ev.timeStamp ? ev : e);
      const out = S.engine.pointerMove(p.u, p.v, t);
      S.whisk.tx = p.px; S.whisk.ty = p.py;
      if (out.started) { D.trail.classList.add('on'); }
      if (out.stroke) onStroke(p);
      else if (Math.random() < 0.35) addParticle(p.px, p.py, 0.6, 1.3);
    }
  }

  function onUp(e) {
    if (e && e.pointerId !== S.pointerId) return;
    S.pointerId = null;
    if (S.engine) S.engine.pointerUp(e ? tsOf(e) : performance.now());
    D.bowl.classList.remove('live');
    if (S.playing) D.whisk.style.opacity = 0.6;
  }

  function onStroke(p) {
    D.mascot.classList.add('bob');
    clearTimeout(S.moveFlash);
    S.moveFlash = setTimeout(() => D.mascot.classList.remove('bob'), 170);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) { /* ignore */ } }
    for (let i = 0; i < 3; i++) addParticle(p.px + (Math.random() - .5) * 18, p.py + (Math.random() - .5) * 18, 1, 2, 2);
    blip();
  }

  function addParticle(x, y, spread, size, extra = 0) {
    if (S.particles.length > 48) S.particles.shift();
    S.particles.push({ x, y, r: Math.random() * size + 1.2 + extra, vx: (Math.random() - .5) * spread * 2, vy: (Math.random() - .5) * spread * 2, life: 1 });
  }

  /* ---------- วงจรวาดภาพ ---------- */
  function startLoop() { if (!S.raf) S.raf = requestAnimationFrame(loop); }
  function stopLoop() { if (S.raf) cancelAnimationFrame(S.raf); S.raf = 0; }

  function loop(now) {
    S.raf = 0;
    if (S.screen !== 'play' || !S.engine) return;
    try { frame(now); } catch (err) { console.error(err); }
    S.raf = requestAnimationFrame(loop);
  }

  function frame(now) {
    const w = S.whisk;
    const size = D.bowl.clientWidth || 260;
    const px = w.x, py = w.y;
    w.x += (w.tx - w.x) * 0.5; w.y += (w.ty - w.y) * 0.5;
    const vx = w.x - px;
    w.rot += ((-6 + Math.max(-14, Math.min(14, vx * 1.6))) - w.rot) * 0.35;      // เอียงตามทิศที่ปาด
    const ww = D.whisk.offsetWidth, hh = D.whisk.offsetHeight;
    D.whisk.style.transform = `translate3d(${(w.x - ww * 0.5).toFixed(1)}px,${(w.y - hh * 0.976).toFixed(1)}px,0) rotate(${w.rot.toFixed(1)}deg)`;

    const eng = S.engine;
    if (!S.finished && eng.started && (now - eng.t0) / 1000 >= CFG.maxSeconds) { finish(true); return; }
    if (now - S.lastUi > 120) { S.lastUi = now; S.lastMetrics = eng.metrics(now); refreshUi(now, false); }
    drawFx(size);
  }

  /* สไปรต์ฟองเม็ดเล็ก (สร้างครั้งเดียว แทนการสร้าง gradient ทุกเฟรม) */
  let SPRITE = null;
  function sprite() {
    if (SPRITE) return SPRITE;
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.55, 'rgba(235,245,230,.62)'); g.addColorStop(1, 'rgba(200,220,190,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return (SPRITE = c);
  }
  function setH(node, html) { if (node._h !== html) { node._h = html; node.innerHTML = html; } }

  function drawFx(size) {
    const foam = S.lastMetrics ? S.lastMetrics.foam : 0;
    const fq = Math.round(foam);
    if (!S.particles.length && !S.fxDirty && S.fxFoam === fq) return;      // ไม่มีอะไรเปลี่ยน ไม่ต้องวาดใหม่
    S.fxDirty = false; S.fxFoam = fq;
    const ctx = D.fx.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    for (const p of S.particles) { p.x += p.vx; p.y += p.vy; p.life -= 0.012; p.vx *= .985; p.vy *= .985; p.r += .018; }
    S.particles = S.particles.filter((p) => p.life > 0.02);
    const sp = sprite();
    for (const p of S.particles) {
      ctx.globalAlpha = p.life * 0.72;
      ctx.drawImage(sp, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    ctx.globalAlpha = 1;
    if (foam > 8) {
      const r = size / 2 * 0.82 * (foam / 100) * 1.9;
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, r);
      g.addColorStop(0, `rgba(255,255,255,${0.14 + foam / 320})`); g.addColorStop(.5, `rgba(232,245,228,${0.1 + foam / 520})`); g.addColorStop(1, 'rgba(200,220,190,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(size / 2, size / 2, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------- อัปเดตตัวเลข/ข้อความ ---------- */
  function moodOf(m, moved) {
    if (!moved) return '😌';
    if (m.smoothness > 75) return '😊';
    if (m.smoothness < 30) return '😵‍💫';
    if (m.smoothness > 55) return '😌';
    return '🤔';
  }

  function refreshUi(now, fresh) {
    const m = S.lastMetrics || S.engine.metrics(now);
    const e = m.elapsed;
    const started = S.engine.started;
    const gold = e >= CFG.goldFrom && e <= CFG.goldTo;
    setStat('time', `${e.toFixed(1)}s`, !started ? 'รอเริ่ม' : gold ? 'ช่วงทอง' : e < CFG.goldFrom ? 'รอ 15วิ' : 'พอแล้ว',
      e / CFG.maxSeconds * 100, gold ? '#4A6B36' : e > CFG.goldTo ? '#B86A7E' : '#9C8359');
    setStat('smooth', `${Math.round(m.smoothness)}%`, m.smoothness < 40 ? 'แกว่ง' : 'นิ่งดี', m.smoothness, '#4A6B36');
    setStat('m', `${Math.round(m.mShape)}%`, `${m.strokes} ครั้ง`, m.mShape, '#121412');
    setStat('foam', `${Math.round(m.foam)}%`, `${Math.round(m.coverage)}% ทั่ว`, m.foam, '#9C8359');

    let hint, icon;
    if (!started) { icon = '👆'; hint = 'แตะแล้วลากซิกแซก → ← ในถ้วยได้เลย|(เริ่มลากแล้ว|จึงจับเวลา)'; }
    else if (gold) { icon = '✦'; hint = 'ช่วงเวลาทอง 15-20 วิ|— ฟองกำลังสวย'; }
    else if (e < CFG.goldFrom) { icon = '🌀'; hint = 'ตีต่อไป…|รอให้ครบ 15 วิ'; }
    else { icon = '🍶'; hint = 'พอแล้วน้า|ตีนานไปฟองจะแตก'; }
    setH(D.hint, `<span aria-hidden="true">${icon}</span><span>${zw(hint)}</span>`);
    if (S.lastGold !== gold) { S.lastGold = gold; D.hint.classList.toggle('gold', gold); }

    const mo = moodOf(m, started); if (D.mood._t !== mo) { D.mood._t = mo; D.mood.textContent = mo; }
    const fq = Math.round(m.foam / 4);
    if (S.foamQ !== fq) { S.foamQ = fq; D.foam.style.background = `radial-gradient(ellipse at 50% 60%,rgba(169,201,164,${0.18 + m.foam / 260}) 0%,rgba(127,167,122,${0.08 + m.foam / 320}) 62%,transparent 82%)`; }
    const sd = !m.canServe || S.finished; if (D.serveBtn.disabled !== sd) D.serveBtn.disabled = sd;
    setH(D.serveBtn, `🍶 พอแล้วเสิร์ฟ! ${e.toFixed(1)}s`);

    if (started) {
      const pts = S.engine.trail(34);
      D.trailLine.setAttribute('points', pts.map(([u, v]) => `${((u + .5) * 120).toFixed(1)},${((v + .5) * 36).toFixed(1)}`).join(' '));
    } else D.trailLine.setAttribute('points', '');
  }

  /* ---------- จบรอบ ---------- */
  function finish(auto) {
    if (S.finished || !S.engine || !S.engine.started) return;
    const m = S.engine.metrics(performance.now());
    if (!auto && !m.canServe) return;
    S.finished = true;
    S.playing = false;
    S.pointerId = null;
    stopLoop();
    const score = scoreRun(m);
    S.last = { score, m, char: S.char };
    chime(score.grade);
    showResult();
  }

  function showResult() {
    const { score: s, m, char: c } = S.last;
    go('result');
    D.rKicker.textContent = `🏆 RESULT • ${c.name}`;
    D.rGrade.innerHTML = `<span aria-hidden="true">${s.gradeEmoji}</span><span>เกรด ${s.grade}</span><small>${s.gradeLabel}</small>`;
    D.rMeta.innerHTML = `<span class="nw">🎯 ${s.total} คะแนน</span> • <span class="nw">⏱️ ${m.elapsed.toFixed(1)}s</span> • <span class="nw">${c.emoji} ${c.short}</span>`;
    const col = { S: '#4A6B36', A: '#6B8F4E', B: '#B89B6B', C: '#9C8359' }[s.grade];
    D.rBadge.textContent = s.grade; D.rBadge.style.background = col;
    D.rImg.src = ASSETS[c.id].src;
    const react = { S: ['✨', 'วิ้งๆ ประกาย!'], A: ['👏', 'ปรบมือ!'], B: ['💪', 'สู้ๆ นะ!'], C: ['🤗', 'กอดๆ นะ'] }[s.grade];
    D.rReact.textContent = react[0];
    D.sayEmoji.textContent = c.emoji; D.sayName.textContent = `${c.name} บอกว่า:`;
    D.sayMood.textContent = `${react[1]} ${react[0]}`;
    D.sayText.innerHTML = `<span aria-hidden="true">${s.gradeEmoji}</span> ${zw(s.feedback)}`;

    const gold = m.elapsed >= CFG.goldFrom && m.elapsed <= CFG.goldTo;
    const rows = [
      ['⏱️', 'เวลา', s.timeScore, `${m.elapsed.toFixed(1)}s`, gold ? '✨ ทอง' : '⏳'],
      ['✨', 'ความเนียน', s.smoothness, 'จังหวะมือ', '🎵'],
      ['Ⓜ️', 'รูปตัว M', s.mShape, `${m.strokes} ครั้ง`, '→←'],
      ['🫧', 'ฟอง & ทั่วถึง', s.foamScore, `${s.coverage}% ทั่ว`, '🫧'],
    ];
    D.metrics.innerHTML = rows.map(([e, l, v, sub, note]) => {
      const bc = v >= 80 ? '#4A6B36' : v >= 60 ? '#B89B6B' : '#D18495';
      return `<div class="metric"><div class="t"><span>${e} ${l}</span><em>${sub} ${note}</em></div>
        <div class="n"><b>${v}</b><small>/100</small></div><div class="bar"><i style="width:${v}%;background:${bc}"></i></div></div>`;
    }).join('');

    D.rBowl.innerHTML = Array.from({ length: 10 }, () => {
      const z = 2 + Math.random() * 5;
      return `<i style="width:${z}px;height:${z}px;left:${20 + Math.random() * 60}%;top:${20 + Math.random() * 60}%"></i>`;
    }).join('') + `<i style="inset:16%;width:auto;height:auto;opacity:.5;filter:blur(2px)"></i>`;

    D.confetti.innerHTML = Array.from({ length: 18 }, (_, k) =>
      `<i style="left:${12 + Math.random() * 76}%;background:${k % 2 ? '#7BA35A' : '#6B8F4E'};animation-delay:${(Math.random() * .6).toFixed(2)}s"></i>`).join('');
  }

  /* ---------- แชร์ ---------- */
  async function share() {
    if (!S.last) return;
    const { score: s, m, char: c } = S.last;
    const text = plain(`${c.emoji} ฉันชงมัทฉะกับ${c.name} ได้เกรด ${s.grade} ${s.gradeLabel} ${s.total} คะแนน! 🍵 ⏱️${m.elapsed.toFixed(1)}s ✨${s.smoothness}% Ⓜ️${s.mShape}% — ${c.bonus} — ${WHISKS[S.whiskIdx].short} / ถ้วย${BOWLS[S.bowlIdx].short} — Matcha Ritual • 🎵 TT: chamii.bkk`);
    let ok = false;
    try {
      if (navigator.share) { await navigator.share({ text }); ok = true; }
      else if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
    } catch (err) { if (err && err.name === 'AbortError') return; }
    if (!ok) {
      const ta = el('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
    }
    const old = D.shareBtn.innerHTML;
    D.shareBtn.innerHTML = ok ? '✅ คัดลอกแล้ว!' : '⚠️ คัดลอกไม่สำเร็จ';
    setTimeout(() => { D.shareBtn.innerHTML = old; }, 1700);
  }

  /* ---------- เสียง (AudioContext เดียว จัดการวงจรชีวิตถูกต้อง) ---------- */
  function ensureAudio() {
    try {
      if (!S.audio) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; S.audio = new AC(); }
      if (S.audio.state === 'suspended') S.audio.resume();
      return S.audio;
    } catch (_) { return null; }
  }
  function tone(freq, dur, vol, type = 'sine', delay = 0) {
    const a = ensureAudio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function blip() {
    if (!S.sound) return;
    const n = performance.now();
    if (n - S.lastBlip < 70) return;
    S.lastBlip = n;
    tone(260 + Math.random() * 260, 0.07, 0.04, 'triangle');
  }
  function chime(grade) {
    if (!S.sound) return;
    const notes = grade === 'S' ? [523, 659, 784, 1047] : grade === 'A' ? [523, 659, 784] : grade === 'B' ? [440, 523] : [330];
    notes.forEach((f, i) => tone(f, 0.28, 0.06, 'sine', i * 0.11));
  }
  function toggleSound() {
    S.sound = !S.sound;
    D.soundBtn.setAttribute('aria-pressed', String(S.sound));
    D.soundBtn.textContent = S.sound ? '🔊' : '🔇';
    if (S.sound) { ensureAudio(); tone(660, 0.12, 0.05); }
  }

  /* ---------- สลับแอป/พักหน้าจอ → หยุดนาฬิกา ---------- */
  function onVisibility() {
    if (!S.engine || S.screen !== 'play') return;
    if (document.hidden) { S.hiddenAt = performance.now(); onUp(); }
    else if (S.hiddenAt) {
      if (S.engine.started) S.engine.shift(performance.now() - S.hiddenAt);
      S.hiddenAt = 0;
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
<script>
